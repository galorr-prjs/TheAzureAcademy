name: Bicep what-if

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read

jobs:
  whatif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC (no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (compares the Bicep file with Azure, changes nothing)
        run: |
          az deployment group what-if \
            --resource-group rg-azure-academy \
            --template-file infra/main.bicep \
            --parameters cosmosAccountName='${{ secrets.COSMOS_ACCOUNT_NAME }}' \
            --validation-level ProviderNoRbac